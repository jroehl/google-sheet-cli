version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
    open-pull-requests-limit: 10
    groups:
      # One PR a month for everything routine. Majors stay ungrouped: they get
      # their own PR because they are the ones worth reading.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The workflows pin third-party actions to commit SHAs. Without this ecosystem those pins
  # would sit still and quietly rot.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
