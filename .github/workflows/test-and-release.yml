name: 'Test (and release) version'
on:
  push:
    branches:
      - master
      - 2.x
  pull_request:
    branches:
      - '**'

# Only the publish job writes anything; a pull request run gets read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Pull requests get the offline suite across the supported range. A push runs the live
      # suite, which talks to the one shared test spreadsheet and must not be parallelised.
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('[18, 20, 24]') || fromJSON('[18]') }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: ci
        run: npm ci

      - name: unit tests
        if: github.event_name == 'pull_request'
        run: npm run test:unit
        env:
          # Node 22.18 and later strip types and load the .ts specs as ES modules, so mocha never
          # falls back to ts-node's CommonJS hook and @oclif/test dies on `module.parent`. Until
          # the toolchain moves off ts-node, keep type stripping off on those versions.
          NODE_OPTIONS: ${{ matrix.node >= 22 && '--no-experimental-strip-types' || '' }}

      # The three credentials are plain repository secrets. A secret that does not exist
      # interpolates to an empty string rather than failing, and an empty one makes the live
      # suite fail deep inside googleapis with an unrelated message; say so here instead.
      - name: assert secrets
        if: github.event_name == 'push'
        run: test -n "$TEST_SPREADSHEET_ID" && test -n "$GSHEET_PRIVATE_KEY" && test -n "$GSHEET_CLIENT_EMAIL"
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}

      - name: test
        if: github.event_name == 'push'
        run: npm run test
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}

      # bin/clear-testsheet.sh drives ./bin/run, which resolves its commands from lib/. lib/ is
      # gitignored and `npm ci` only fires the husky prepare script, so without this the next step
      # exits 2 with "command spreadsheet:get not found", takes the whole job down under
      # `set -euo pipefail`, and publish never runs.
      - name: build
        if: github.event_name == 'push'
        run: npm run build

      # Reports what the cron would remove, without removing anything, so a bad classification
      # shows up on the push that caused it.
      - name: cleanup dry run
        if: github.event_name == 'push'
        run: npm run cleanup -- --dry-run
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}

      - name: check for uncommitted changes
        # Ensure no changes, but ignore node_modules dir since dev/fresh ci deps installed.
        run: |
          git diff --exit-code --stat -- . ':!node_modules' \
          || (echo "##[error] found changed files after build. please 'npm run build && npm run format'" \
                   "and check in all changes" \
              && exit 1)

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/2.x')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing. The npm CLI trades this job's OIDC token for a short-lived
      # credential, so the package needs no long-lived npm token anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v3

      # npm learned trusted publishing in 11.5.1 and no Node 18 ships an npm that new. This
      # pins the Node that runs semantic-release only; the package still supports Node 14
      # upward and the test matrix is what says so.
      - uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'

      - name: ci
        run: npm ci

      - name: semantic-release
        run: |
          npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
