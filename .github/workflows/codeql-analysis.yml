# CodeQL's default JavaScript analysis. The set of languages and the schedule are GitHub's
# starter workflow; only the action versions are maintained here.
#
# Third-party actions are pinned to the commit their tag pointed at when this workflow was
# written, with the tag in the comment; see .github/workflows/test-and-release.yml.
name: 'CodeQL'

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
  schedule:
    - cron: '42 18 * * 6'

# Read-only by default; the analyze job asks for the one write scope it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}

      # There is nothing to compile for JavaScript, but autobuild is what the starter workflow
      # runs and it is a no-op here.
      - name: Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9

      # This was still on v1, which GitHub retired; the analysis has not been running.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
