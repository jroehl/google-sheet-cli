# Removes the worksheets our test runs leave behind on the shared test spreadsheet. What may be
# deleted is decided by bin/cleanup-classify.js; see bin/clear-testsheet.sh.
name: 'Cleanup'

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: ci
        run: npm ci

      # clear-testsheet.sh drives ./bin/run, which resolves its commands from the gitignored lib/.
      # `npm ci` only fires the husky prepare script, so without this the cron exits 2 with
      # "command spreadsheet:get not found" and nothing is ever cleaned up.
      - name: build
        run: npm run build

      # The credentials are plain repository secrets, and one that does not exist interpolates
      # to an empty string rather than failing. clear-testsheet.sh checks TEST_SPREADSHEET_ID
      # itself but not the other two, and an empty client email or private key reaches the CLI's
      # interactive credential prompt. A runner has no terminal, so that prompt reads EOF, takes
      # it for an empty answer and asks again, forever: the cron would spin until the job timeout
      # rather than fail. This one deletes worksheets unattended, so name the missing secret.
      - name: assert secrets
        run: test -n "$TEST_SPREADSHEET_ID" && test -n "$GSHEET_PRIVATE_KEY" && test -n "$GSHEET_CLIENT_EMAIL"
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}

      - name: cleanup
        run: npm run cleanup
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}
