# Removes the worksheets our test runs leave behind on the shared test spreadsheet. What may be
# deleted is decided by bin/cleanup-classify.js; see bin/clear-testsheet.sh.
name: 'Cleanup'

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: ci
        run: npm ci

      # clear-testsheet.sh drives ./bin/run, which resolves its commands from the gitignored lib/.
      # `npm ci` only fires the husky prepare script, so without this the cron exits 2 with
      # "command spreadsheet:get not found" and nothing is ever cleaned up.
      - name: build
        run: npm run build

      - name: Configure 1Password Service Account
        uses: 1password/load-secrets-action/configure@v1
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load Secrets
        uses: 1password/load-secrets-action@v1
        with:
          unset-previous: false
          export-env: true
        env:
          GSHEET_CLIENT_EMAIL: 'op://service-account/github.actions/GSHEET_CLIENT_EMAIL'
          GSHEET_PRIVATE_KEY: 'op://service-account/github.actions/GSHEET_PRIVATE_KEY'
          TEST_SPREADSHEET_ID: 'op://service-account/github.actions/TEST_SPREADSHEET_ID'

      - name: cleanup
        run: npm run cleanup
        env:
          GSHEET_CLIENT_EMAIL: ${{ env.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ env.GSHEET_PRIVATE_KEY }}
          TEST_SPREADSHEET_ID: ${{ env.TEST_SPREADSHEET_ID }}
